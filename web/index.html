<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NYC Zoning Envelope Explorer</title>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet" />
    <link rel="stylesheet" href="/web/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="panel">
        <div class="hero">
          <p class="eyebrow">Neighborhood PLUTO + zoning massing</p>
          <h1>NYC Zoning Envelope Explorer</h1>
          <p class="small">
            Pick a split neighborhood file, then click a lot. Existing buildings extrude from that
            neighborhood's PLUTO attributes, and the zoning envelope uses the selected lot's zoning fields.
          </p>
          <div id="dataStatus" class="small"></div>
        </div>

        <div class="group">
          <label for="neighborhoodSelect">Neighborhood</label>
          <select id="neighborhoodSelect">
            <option value="">Loading neighborhoods...</option>
          </select>
        </div>

        <div class="group">
          <label for="borough">Borough</label>
          <select id="borough">
            <option value="1">Manhattan</option>
            <option value="2">Bronx</option>
            <option value="3" selected>Brooklyn</option>
            <option value="4">Queens</option>
            <option value="5">Staten Island</option>
          </select>
        </div>

        <div class="group grid-3">
          <div>
            <label for="block">Block</label>
            <input id="block" type="number" value="981" min="1" />
          </div>
          <div>
            <label for="lot">Lot</label>
            <input id="lot" type="number" value="1" min="1" />
          </div>
          <div class="align-end">
            <button id="lookupBtn" type="button">Find In Neighborhood</button>
          </div>
        </div>

        <hr />

        <div class="group">
          <label for="farSlider">Scenario FAR</label>
          <div class="inline compact-row">
            <input id="farSlider" type="range" min="0.1" max="15" step="0.01" value="3" />
            <span id="farVal" class="value-pill">3.00</span>
          </div>
        </div>

        <div class="group">
          <label for="coverage">Envelope Coverage</label>
          <div class="inline compact-row">
            <input id="coverage" type="range" min="20" max="100" step="1" value="80" />
            <span id="covVal" class="value-pill">80%</span>
          </div>
        </div>

        <div class="group grid-2">
          <div>
            <label for="floorHeight">Floor Height (ft)</label>
            <input id="floorHeight" type="number" min="8" max="20" step="0.5" value="10" />
          </div>
          <div>
            <label for="useType">Use Type</label>
            <select id="useType">
              <option value="market_rate">Market Rate</option>
              <option value="affordable">Affordable</option>
            </select>
          </div>
        </div>

        <div class="group grid-2">
          <label class="checkbox-field">
            <input id="farMode" type="checkbox" checked />
            Use custom coverage
          </label>
          <label class="checkbox-field">
            <input id="upzoneToggle" type="checkbox" />
            Upzone scenario
          </label>
        </div>

        <div class="group grid-2">
          <label class="checkbox-field">
            <input id="showBuildingToggle" type="checkbox" checked />
            Show existing buildings
          </label>
          <label class="checkbox-field">
            <input id="showEnvelopeToggle" type="checkbox" checked />
            Show zoning envelope
          </label>
        </div>

        <div class="group">
          <button id="runBtn" type="button">Generate Selected Lot Envelope</button>
        </div>

        <div id="lotSummary" class="lot-summary empty">Choose a neighborhood and click a lot.</div>
        <pre id="report"></pre>
      </aside>

      <main class="map-wrap">
        <div id="map"></div>
      </main>
    </div>

    <script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>
    <script type="module" src="/web/app.js"></script>
  </body>
</html>
